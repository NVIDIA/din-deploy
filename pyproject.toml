[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "din-deploy"
version = "0.1.0"
description = "Optimized local ONNX inference samples."
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "onnx",
    "datasets",
    "huggingface_hub",
    "onnxruntime",
    "onnxruntime-ep-nv-tensorrt-rtx",
    "numpy",
    "onnxscript",
    "safetensors",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
parakeet = [
    "nemo_toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/Speech.git@v3.0.0",
    "jiwer",
]
nemotron = [
    "nemo_toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/Speech.git@v3.0.0",
    "jiwer",
]
sam2 = [
    "av",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
flux = [
    "accelerate",
    "comfy-kitchen>=0.2.22",
    "diffusers",
    "nvidia-modelopt",
    "pillow",
    "transformers",
]

# Python is used for model preparation; inference is provided by the C++ CLIs.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["asr/parakeet/model_export", "asr/nemotron/model_export", "common/model_export", "vision/sam2/python"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"asr/parakeet/model_export/*.py" = ["E402"]
"asr/nemotron/model_export/*.py" = ["E402"]
