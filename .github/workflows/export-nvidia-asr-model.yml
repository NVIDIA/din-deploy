name: Export NVIDIA ASR model

on:
  workflow_call:
    inputs:
      model_slug:
        required: true
        type: string
      model_label:
        required: true
        type: string
      model_id:
        required: true
        type: string
      model_type:
        required: true
        type: string
      precision:
        required: true
        type: string
      fallback_precision:
        required: false
        default: ''
        type: string
      source_ref:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.export.outputs.artifact_name }}
      artifact_run_id:
        value: ${{ jobs.export.outputs.artifact_run_id }}

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Export ${{ inputs.model_label }} ONNX
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_name: ${{ steps.final-artifact.outputs.name }}
      artifact_run_id: ${{ steps.final-artifact.outputs.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Determine export requirement
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            force=false
          elif [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            force=true
          elif git diff --quiet "$BASE_SHA" "$SOURCE_REF" -- \
            'asr/rnnt/python/*.py' \
            'asr/rnnt/python/**/*.py' \
            '.github/workflows/export-nvidia-asr-model.yml' \
            '.github/workflows/nvidia-asr.yml'; then
            force=false
          else
            force=true
          fi
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Compute artifact names
        id: artifact-names
        shell: bash
        env:
          FALLBACK_PRECISION: ${{ inputs.fallback_precision }}
          MODEL_SLUG: ${{ inputs.model_slug }}
          MODEL_TYPE: ${{ inputs.model_type }}
          PRECISION: ${{ inputs.precision }}
        run: |
          set -euo pipefail
          case "$MODEL_TYPE" in
            parakeet|nemotron) ;;
            *) echo "Unsupported NVIDIA ASR model type: $MODEL_TYPE" >&2; exit 2 ;;
          esac
          case "$PRECISION" in
            fp16|fp32) ;;
            *) echo "Unsupported precision: $PRECISION" >&2; exit 2 ;;
          esac
          if [[ -n "$FALLBACK_PRECISION" ]]; then
            case "$FALLBACK_PRECISION" in
              fp16|fp32) ;;
              *) echo "Unsupported fallback precision: $FALLBACK_PRECISION" >&2; exit 2 ;;
            esac
          fi
          echo "primary=asr-${MODEL_SLUG}-onnx-${PRECISION}" >> "$GITHUB_OUTPUT"
          if [[ -n "$FALLBACK_PRECISION" ]]; then
            echo "fallback=asr-${MODEL_SLUG}-onnx-${FALLBACK_PRECISION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Find successful primary artifact
        if: steps.changes.outputs.force != 'true'
        id: primary-artifact
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python .github/scripts/find_successful_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "${{ steps.artifact-names.outputs.primary }}" \
            --default-branch "$DEFAULT_BRANCH" \
            --event-name "$EVENT_NAME" \
            --source-branch "$SOURCE_BRANCH"

      - name: Find successful fallback artifact
        if: >-
          steps.changes.outputs.force != 'true' &&
          steps.primary-artifact.outputs.found != 'true' &&
          inputs.fallback_precision != ''
        id: fallback-artifact
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python .github/scripts/find_successful_artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-name "${{ steps.artifact-names.outputs.fallback }}" \
            --default-branch "$DEFAULT_BRANCH" \
            --event-name "$EVENT_NAME" \
            --source-branch "$SOURCE_BRANCH"

      - name: Select export action
        id: selection
        shell: bash
        env:
          FALLBACK_FOUND: ${{ steps.fallback-artifact.outputs.found }}
          FALLBACK_NAME: ${{ steps.fallback-artifact.outputs.name }}
          FALLBACK_RUN_ID: ${{ steps.fallback-artifact.outputs.run_id }}
          FORCE_EXPORT: ${{ steps.changes.outputs.force }}
          PRIMARY_FOUND: ${{ steps.primary-artifact.outputs.found }}
          PRIMARY_NAME: ${{ steps.primary-artifact.outputs.name }}
          PRIMARY_RUN_ID: ${{ steps.primary-artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_EXPORT" == "true" ]]; then
            echo "export=true" >> "$GITHUB_OUTPUT"
          elif [[ "$PRIMARY_FOUND" == "true" ]]; then
            echo "export=false" >> "$GITHUB_OUTPUT"
            echo "name=$PRIMARY_NAME" >> "$GITHUB_OUTPUT"
            echo "run_id=$PRIMARY_RUN_ID" >> "$GITHUB_OUTPUT"
          elif [[ "$FALLBACK_FOUND" == "true" ]]; then
            echo "export=false" >> "$GITHUB_OUTPUT"
            echo "name=$FALLBACK_NAME" >> "$GITHUB_OUTPUT"
            echo "run_id=$FALLBACK_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "export=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim runner disk space
        if: steps.selection.outputs.export == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /

      - name: Set up Python
        if: steps.selection.outputs.export == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install NeMo export dependencies
        if: steps.selection.outputs.export == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            onnx \
            onnxscript \
            soundfile \
            "nemo_toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@main"

      - name: Export NVIDIA ASR ONNX
        if: steps.selection.outputs.export == 'true'
        id: exported
        shell: bash
        env:
          FALLBACK_PRECISION: ${{ inputs.fallback_precision }}
          MODEL_ID: ${{ inputs.model_id }}
          MODEL_OUTPUT: artifacts/ci/${{ inputs.model_slug }}
          MODEL_SLUG: ${{ inputs.model_slug }}
          MODEL_TYPE: ${{ inputs.model_type }}
          PRECISION: ${{ inputs.precision }}
          PYTHONPATH: asr/rnnt/python
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -uo pipefail
          export_dtype() {
            case "$1" in
              fp16) echo float16 ;;
              fp32) echo float32 ;;
              *) return 2 ;;
            esac
          }
          run_export() {
            local dtype
            dtype="$(export_dtype "$1")"
            case "$MODEL_TYPE" in
              parakeet)
                python asr/rnnt/python/tools/export_parakeet_tdt_onnx.py \
                  --model "$MODEL_ID" \
                  --output "$MODEL_OUTPUT" \
                  --device cpu \
                  --dtype "$dtype" \
                  --external-data
                ;;
              nemotron)
                python asr/rnnt/python/tools/export_nemotron_onnx.py \
                  --model "$MODEL_ID" \
                  --output "$MODEL_OUTPUT" \
                  --device cpu \
                  --dtype "$dtype" \
                  --external-data
                ;;
            esac
          }

          selected_precision="$PRECISION"
          set +e
          run_export "$selected_precision"
          export_status=$?
          set -e
          if [[ $export_status -ne 0 ]]; then
            if [[ -z "$FALLBACK_PRECISION" ]]; then
              exit "$export_status"
            fi
            echo "::warning::$PRECISION export failed; retrying once with $FALLBACK_PRECISION."
            rm -rf "$MODEL_OUTPUT"
            selected_precision="$FALLBACK_PRECISION"
            run_export "$selected_precision"
          fi

          case "$MODEL_TYPE" in
            parakeet)
              required_files=(preprocessor.onnx encoder.onnx predict_step.onnx metadata.json tokenizer.json)
              ;;
            nemotron)
              required_files=(preprocessor.onnx encoder_step.onnx predict_step.onnx metadata.json vocab.txt decoder_init_hidden.f32 decoder_init_cell.f32)
              ;;
          esac
          for required_file in "${required_files[@]}"; do
            test -f "$MODEL_OUTPUT/$required_file"
          done

          export MODEL_ID MODEL_OUTPUT SELECTED_PRECISION="$selected_precision" SOURCE_REF
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["MODEL_OUTPUT"])
          manifest = {
              "model_id": os.environ["MODEL_ID"],
              "precision": os.environ["SELECTED_PRECISION"],
              "commit": os.environ["SOURCE_REF"],
          }
          (output / "ci-export-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          echo "name=asr-${MODEL_SLUG}-onnx-${selected_precision}" >> "$GITHUB_OUTPUT"

      - name: Upload NVIDIA ASR ONNX
        if: steps.selection.outputs.export == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.exported.outputs.name }}
          path: artifacts/ci/${{ inputs.model_slug }}/
          if-no-files-found: error
          compression-level: 0

      - name: Select model artifact run
        id: final-artifact
        shell: bash
        env:
          EXISTING_NAME: ${{ steps.selection.outputs.name }}
          EXISTING_RUN_ID: ${{ steps.selection.outputs.run_id }}
          EXPORTED: ${{ steps.selection.outputs.export }}
          EXPORTED_NAME: ${{ steps.exported.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$EXPORTED" == "true" ]]; then
            echo "name=$EXPORTED_NAME" >> "$GITHUB_OUTPUT"
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "name=$EXISTING_NAME" >> "$GITHUB_OUTPUT"
            echo "run_id=$EXISTING_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
