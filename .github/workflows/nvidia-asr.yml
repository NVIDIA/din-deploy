name: NVIDIA ASR

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build workflow run ID whose artifacts should be tested
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nvidia-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/model-changes.yml

  requirements:
    needs: changes
    if: needs.changes.outputs.parakeet == 'true' || needs.changes.outputs.nemotron == 'true'
    name: Wait for Build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      build_run_id: ${{ steps.build.outputs.run_id }}
      source_ref: ${{ steps.build.outputs.source_ref }}

    steps:
      - name: Resolve successful Build run
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          while [[ -z "$run_id" ]]; do
            run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
                --jq ".workflow_runs | map(select(.head_sha == \"$SOURCE_SHA\" and .event == \"$EVENT_NAME\")) | sort_by(.created_at) | last | .id // empty"
            )"
            [[ -n "$run_id" ]] || sleep 10
          done
          while true; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [[ "$status" == "completed" ]] && break
            sleep 15
          done
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Build run ${run_id} concluded ${conclusion}" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          source_ref="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  export-parakeet:
    if: needs.changes.outputs.parakeet == 'true'
    name: Export Parakeet TDT ONNX
    needs: [requirements, changes]
    uses: ./.github/workflows/export-nvidia-asr-model.yml
    with:
      model_slug: parakeet-tdt
      model_label: Parakeet TDT
      model_id: nvidia/parakeet-tdt-0.6b-v3
      model_type: parakeet
      precision: fp16
      fallback_precision: fp32
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-nemotron:
    if: needs.changes.outputs.nemotron == 'true'
    name: Export Nemotron 3.5 ASR Streaming ONNX
    needs: [requirements, changes]
    uses: ./.github/workflows/export-nvidia-asr-model.yml
    with:
      model_slug: nemotron-3.5-asr-streaming-0.6b
      model_label: Nemotron 3.5 ASR Streaming 0.6B
      model_id: nvidia/nemotron-3.5-asr-streaming-0.6b
      model_type: nemotron
      precision: fp16
      fallback_precision: fp32
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  artifacts:
    name: Collect NVIDIA ASR artifacts
    needs: [requirements, export-parakeet, export-nemotron]
    if: >-
      !cancelled() && !failure() &&
      (needs.export-parakeet.result == 'success' || needs.export-nemotron.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build runtime matrix
        id: matrix
        shell: bash
        env:
          NEMOTRON_NAME: ${{ needs.export-nemotron.outputs.artifact_name }}
          NEMOTRON_RUN_ID: ${{ needs.export-nemotron.outputs.artifact_run_id }}
          PARAKEET_NAME: ${{ needs.export-parakeet.outputs.artifact_name }}
          PARAKEET_RUN_ID: ${{ needs.export-parakeet.outputs.artifact_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = {
              "include": [
                  {
                      "slug": "parakeet-tdt",
                      "label": "Parakeet TDT",
                      "executable": "din_asr_parakeet_tdt_cli",
                      "artifact_name": os.environ["PARAKEET_NAME"],
                      "artifact_run_id": os.environ["PARAKEET_RUN_ID"],
                  },
                  {
                      "slug": "nemotron-3.5-asr-streaming-0.6b",
                      "label": "Nemotron 3.5 ASR Streaming 0.6B",
                      "executable": "din_asr_nemotron_cli",
                      "artifact_name": os.environ["NEMOTRON_NAME"],
                      "artifact_run_id": os.environ["NEMOTRON_RUN_ID"],
                  },
              ]
          }
          matrix["include"] = [model for model in matrix["include"] if model["artifact_name"]]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  linux-runtime:
    name: Linux x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.1-runtime-ubuntu24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.artifacts.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.artifact_run_id }}

      - name: Run C++ CPU smoke test
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          chmod +x "runtime/${{ matrix.executable }}"
          "runtime/${{ matrix.executable }}" \
            assets/sample.wav \
            --model-dir "models/${{ matrix.slug }}" \
            --provider cpu

  windows-runtime:
    name: Windows x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.artifacts.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Windows build artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.artifact_run_id }}

      - name: Run C++ CPU smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "runtime/${{ matrix.executable }}.exe" `
            "assets/sample.wav" `
            --model-dir "models/${{ matrix.slug }}" `
            --provider cpu
