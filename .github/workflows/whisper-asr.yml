name: Whisper ASR

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build workflow run ID whose artifacts should be tested
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: whisper-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/model-changes.yml

  requirements:
    needs: changes
    if: needs.changes.outputs.whisper == 'true'
    name: Wait for Build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      build_run_id: ${{ steps.build.outputs.run_id }}
      source_ref: ${{ steps.build.outputs.source_ref }}

    steps:
      - name: Resolve successful Build run
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          while [[ -z "$run_id" ]]; do
            run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
                --jq ".workflow_runs | map(select(.head_sha == \"$SOURCE_SHA\" and .event == \"$EVENT_NAME\" and .conclusion != \"skipped\")) | sort_by(.created_at) | last | .id // empty"
            )"
            [[ -n "$run_id" ]] || sleep 10
          done
          while true; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [[ "$status" == "completed" ]] && break
            sleep 15
          done
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Build run ${run_id} concluded ${conclusion}" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          source_ref="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  export-tiny:
    name: Export Whisper Tiny ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-tiny
      model_label: Whisper Tiny
      model_id: openai/whisper-tiny
      precision: fp16
      fallback_precision: fp32
      attention: sdpa
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-base:
    name: Export Whisper Base ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-base
      model_label: Whisper Base
      model_id: openai/whisper-base
      precision: fp32
      attention: sdpa
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-small:
    name: Export Whisper Small ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-small
      model_label: Whisper Small
      model_id: openai/whisper-small
      precision: fp16
      fallback_precision: fp32
      attention: math
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-medium:
    name: Export Whisper Medium ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-medium
      model_label: Whisper Medium
      model_id: openai/whisper-medium
      precision: fp32
      attention: sdpa
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-large-v3:
    name: Export Whisper Large v3 ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-large-v3
      model_label: Whisper Large v3
      model_id: openai/whisper-large-v3
      precision: fp16
      fallback_precision: fp32
      attention: sdpa
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  export-large-v3-turbo:
    name: Export Whisper Large v3 Turbo ONNX
    needs: requirements
    uses: ./.github/workflows/export-whisper-model.yml
    with:
      model_slug: whisper-large-v3-turbo
      model_label: Whisper Large v3 Turbo
      model_id: openai/whisper-large-v3-turbo
      precision: fp16
      fallback_precision: fp32
      attention: sdpa
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  artifacts:
    name: Collect Whisper artifacts
    needs:
      - export-tiny
      - export-base
      - export-small
      - export-medium
      - export-large-v3
      - export-large-v3-turbo
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Build runtime matrix
        id: matrix
        shell: bash
        env:
          BASE_NAME: ${{ needs.export-base.outputs.artifact_name }}
          BASE_RUN_ID: ${{ needs.export-base.outputs.artifact_run_id }}
          LARGE_NAME: ${{ needs.export-large-v3.outputs.artifact_name }}
          LARGE_RUN_ID: ${{ needs.export-large-v3.outputs.artifact_run_id }}
          MEDIUM_NAME: ${{ needs.export-medium.outputs.artifact_name }}
          MEDIUM_RUN_ID: ${{ needs.export-medium.outputs.artifact_run_id }}
          SMALL_NAME: ${{ needs.export-small.outputs.artifact_name }}
          SMALL_RUN_ID: ${{ needs.export-small.outputs.artifact_run_id }}
          TINY_NAME: ${{ needs.export-tiny.outputs.artifact_name }}
          TINY_RUN_ID: ${{ needs.export-tiny.outputs.artifact_run_id }}
          TURBO_NAME: ${{ needs.export-large-v3-turbo.outputs.artifact_name }}
          TURBO_RUN_ID: ${{ needs.export-large-v3-turbo.outputs.artifact_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          models = [
              ("whisper-tiny", "Whisper Tiny", "TINY"),
              ("whisper-base", "Whisper Base", "BASE"),
              ("whisper-small", "Whisper Small", "SMALL"),
              ("whisper-medium", "Whisper Medium", "MEDIUM"),
              ("whisper-large-v3", "Whisper Large v3", "LARGE"),
              ("whisper-large-v3-turbo", "Whisper Large v3 Turbo", "TURBO"),
          ]
          matrix = {
              "include": [
                  {
                      "slug": slug,
                      "label": label,
                      "artifact_name": os.environ[f"{key}_NAME"],
                      "artifact_run_id": os.environ[f"{key}_RUN_ID"],
                  }
                  for slug, label, key in models
              ]
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  linux-runtime:
    name: Linux x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.1-runtime-ubuntu24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.artifacts.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.artifact_run_id }}

      - name: Run C++ CPU smoke test
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          chmod +x runtime/din_asr_whisper_cli
          runtime/din_asr_whisper_cli \
            assets/sample.wav \
            --model-dir "models/${{ matrix.slug }}" \
            --provider cpu

  windows-runtime:
    name: Windows x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.artifacts.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Windows build artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.artifact_run_id }}

      - name: Run C++ CPU smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "runtime/din_asr_whisper_cli.exe" `
            "assets/sample.wav" `
            --model-dir "models/${{ matrix.slug }}" `
            --provider cpu
