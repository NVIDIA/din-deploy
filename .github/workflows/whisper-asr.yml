name: Whisper ASR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build workflow run ID whose artifacts should be tested
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: whisper-asr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Wait for Build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      build_run_id: ${{ steps.build.outputs.run_id }}
      python_changed: ${{ steps.read.outputs.python_changed }}
      source_ref: ${{ steps.read.outputs.source_ref }}

    steps:
      - name: Resolve successful Build run
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          while [[ -z "$run_id" ]]; do
            run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100" \
                --jq ".workflow_runs | map(select(.head_sha == \"$SOURCE_SHA\" and .event == \"$EVENT_NAME\")) | sort_by(.created_at) | last | .id // empty"
            )"
            [[ -n "$run_id" ]] || sleep 10
          done
          while true; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [[ "$status" == "completed" ]] && break
            sleep 15
          done
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "Build run ${run_id} concluded ${conclusion}" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Build requirements
        uses: actions/download-artifact@v8
        with:
          name: ci-requirements
          path: ci-requirements
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Read Whisper requirements
        id: read
        shell: bash
        run: |
          set -euo pipefail
          source ci-requirements/requirements.env
          echo "python_changed=$whisper_python_changed" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  export:
    name: Export ${{ matrix.label }} ONNX
    needs: requirements
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: whisper-tiny
            label: Whisper Tiny
            model_id: openai/whisper-tiny
            precision: fp16
            fallback_precision: fp32
            attention: sdpa
          - slug: whisper-base
            label: Whisper Base
            model_id: openai/whisper-base
            precision: fp32
            fallback_precision: ''
            attention: sdpa
          - slug: whisper-small
            label: Whisper Small
            model_id: openai/whisper-small
            precision: fp16
            fallback_precision: fp32
            attention: math
          - slug: whisper-medium
            label: Whisper Medium
            model_id: openai/whisper-medium
            precision: fp32
            fallback_precision: ''
            attention: sdpa
          - slug: whisper-large-v3
            label: Whisper Large v3
            model_id: openai/whisper-large-v3
            precision: fp16
            fallback_precision: fp32
            attention: sdpa
          - slug: whisper-large-v3-turbo
            label: Whisper Large v3 Turbo
            model_id: openai/whisper-large-v3-turbo
            precision: fp16
            fallback_precision: fp32
            attention: sdpa
    uses: ./.github/workflows/export-asr-model.yml
    with:
      model_slug: ${{ matrix.slug }}
      model_label: ${{ matrix.label }}
      model_id: ${{ matrix.model_id }}
      exporter: whisper
      precision: ${{ matrix.precision }}
      fallback_precision: ${{ matrix.fallback_precision }}
      attention: ${{ matrix.attention }}
      python_changed: ${{ needs.requirements.outputs.python_changed }}
      source_ref: ${{ needs.requirements.outputs.source_ref }}

  artifacts:
    name: Resolve Whisper artifacts
    needs: [requirements, export]
    runs-on: ubuntu-24.04
    outputs:
      models: ${{ steps.resolve.outputs.models }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Resolve model artifacts
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_hash="$(
            git ls-files -z -- 'asr/whisper/*.py' 'asr/whisper/**/*.py' \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d' ' -f1
          )"
          models='{}'
          for slug in \
            whisper-tiny \
            whisper-base \
            whisper-small \
            whisper-medium \
            whisper-large-v3 \
            whisper-large-v3-turbo; do
            artifact_name="asr-${slug}-onnx-v1-${source_hash:0:16}"
            artifact_run_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | last | .workflow_run.id // empty'
            )"
            test -n "$artifact_run_id"
            models="$(jq \
              --arg slug "$slug" \
              --arg name "$artifact_name" \
              --arg run_id "$artifact_run_id" \
              '. + {($slug): {name: $name, run_id: $run_id}}' \
              <<< "$models")"
          done
          echo "models=$(jq -c . <<< "$models")" >> "$GITHUB_OUTPUT"

  linux-runtime:
    name: Linux x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.1-runtime-ubuntu24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: whisper-tiny
            label: Whisper Tiny
          - slug: whisper-base
            label: Whisper Base
          - slug: whisper-small
            label: Whisper Small
          - slug: whisper-medium
            label: Whisper Medium
          - slug: whisper-large-v3
            label: Whisper Large v3
          - slug: whisper-large-v3-turbo
            label: Whisper Large v3 Turbo

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.artifacts.outputs.models)[matrix.slug].name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(needs.artifacts.outputs.models)[matrix.slug].run_id }}

      - name: Run C++ CPU smoke test
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/runtime
        run: |
          set -euxo pipefail
          chmod +x runtime/din_asr_whisper_cli
          runtime/din_asr_whisper_cli \
            assets/sample.wav \
            --model-dir "models/${{ matrix.slug }}" \
            --provider cpu

  windows-runtime:
    name: Windows x64 / CPU / ${{ matrix.label }}
    needs: [requirements, artifacts]
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: whisper-tiny
            label: Whisper Tiny
          - slug: whisper-base
            label: Whisper Base
          - slug: whisper-small
            label: Whisper Small
          - slug: whisper-medium
            label: Whisper Medium
          - slug: whisper-large-v3
            label: Whisper Large v3
          - slug: whisper-large-v3-turbo
            label: Whisper Large v3 Turbo

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.requirements.outputs.source_ref }}

      - name: Download Windows build artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.requirements.outputs.build_run_id }}

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.artifacts.outputs.models)[matrix.slug].name }}
          path: models/${{ matrix.slug }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(needs.artifacts.outputs.models)[matrix.slug].run_id }}

      - name: Run C++ CPU smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "runtime/din_asr_whisper_cli.exe" `
            "assets/sample.wav" `
            --model-dir "models/${{ matrix.slug }}" `
            --provider cpu
