name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  changes:
    name: Determine build and export requirements
    runs-on: ubuntu-24.04
    outputs:
      build_trt_rtx_ep: ${{ steps.requirements.outputs.build_trt_rtx_ep }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine build and export requirements
        id: requirements
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_trt_rtx_ep=ON
            sam2_python_changed=false
          elif [[ -z "$BASE_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            build_trt_rtx_ep=ON
            sam2_python_changed=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            if grep -Eq '^(cmake/|CMakePresets\.json$)' <<< "$changed_files"; then
              build_trt_rtx_ep=ON
            else
              build_trt_rtx_ep=OFF
            fi
            if grep -Eq '^vision/sam2/python/.*\.py$' <<< "$changed_files"; then
              sam2_python_changed=true
            else
              sam2_python_changed=false
            fi
          fi
          echo "build_trt_rtx_ep=$build_trt_rtx_ep" >> "$GITHUB_OUTPUT"
          mkdir -p ci-requirements
          {
            echo "source_ref=$GITHUB_SHA"
            echo "sam2_python_changed=$sam2_python_changed"
          } > ci-requirements/requirements.env

      - name: Upload model export requirements
        uses: actions/upload-artifact@v7
        with:
          name: ci-requirements
          path: ci-requirements/requirements.env
          if-no-files-found: error

  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install clang-format
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          llvm_install_script="${RUNNER_TEMP}/llvm.sh"
          curl --fail --location --silent --show-error https://apt.llvm.org/llvm.sh --output "$llvm_install_script"
          sudo bash "$llvm_install_script" 22
          sudo apt-get install -y --no-install-recommends clang-format-22

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          clang-format-22 --version
          git ls-files -z -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.cu' '*.cuh' \
            | xargs -0 -r clang-format-22 --dry-run --Werror --

  linux-x64:
    name: Ubuntu 24.04 / Clang / x64
    runs-on: ubuntu-24.04
    needs: changes
    container: nvidia/cuda:13.2.1-devel-ubuntu24.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3 python3-dev

      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/linux-x64/_deps
          key: linux-x64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset linux-x64 \
            -DDIN_BUILD_TRT_RTX_EP=${{ needs.changes.outputs.build_trt_rtx_ep }}

      - name: Build
        run: cmake --build --preset linux-x64-release --parallel

      - name: List registered CTest tests
        run: ctest --test-dir out/build/linux-x64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-release
          if-no-files-found: error
          path: out/build/linux-x64/bin/Release/

  linux-arm64:
    name: Ubuntu 24.04 / Clang / ARM64
    runs-on: ubuntu-24.04-arm
    needs: changes
    container: nvidia/cuda:13.2.1-devel-ubuntu24.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3 python3-dev

      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/linux-arm64/_deps
          key: linux-arm64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: bash
        run: cmake --preset linux-arm64 -DDIN_BUILD_TRT_RTX_EP=${{ needs.changes.outputs.build_trt_rtx_ep }}

      - name: Build
        run: cmake --build --preset linux-arm64-release --parallel

      - name: List registered CTest tests
        run: ctest --test-dir out/build/linux-arm64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-release
          if-no-files-found: error
          path: out/build/linux-arm64/bin/Release/

  windows-x64:
    name: Windows Server 2025 / MSVC / x64
    runs-on: windows-2025
    needs: changes
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.1'

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/windows-x64/_deps
          key: windows-x64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 `
            -DDIN_BUILD_TRT_RTX_EP=${{ needs.changes.outputs.build_trt_rtx_ep }}

      - name: Build
        run: cmake --build --preset windows-x64-release --parallel

      - name: List registered CTest tests
        run: ctest --test-dir out/build/windows-x64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: out/build/windows-x64/bin/Release/
