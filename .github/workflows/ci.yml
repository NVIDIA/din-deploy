name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      targets: ${{ steps.plan.outputs.targets }}
      models: ${{ steps.plan.outputs.models }}
      matrix: ${{ steps.plan.outputs.matrix }}
      format: ${{ steps.plan.outputs.format }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate CI selection and execution recipes
        run: python -m unittest discover -s .github/tests -v
      - name: Select affected components
        id: plan
        run: python .github/scripts/model_ci.py plan

  clang-format:
    needs: plan
    if: needs.plan.outputs.format == 'true'
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install clang-format
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          llvm_install_script="${RUNNER_TEMP}/llvm.sh"
          curl --fail --location --silent --show-error https://apt.llvm.org/llvm.sh --output "$llvm_install_script"
          sudo bash "$llvm_install_script" 22
          sudo apt-get install -y --no-install-recommends clang-format-22

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          clang-format-22 --version
          git ls-files -z -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.cu' '*.cuh' \
            | xargs -0 -r clang-format-22 --dry-run --Werror --

  linux-x64:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Ubuntu 24.04 / Clang / x64
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.2.1-devel-ubuntu24.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3 python3-dev

      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/linux-x64/_deps
          key: linux-x64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: bash
        run: |
          cmake --preset linux-x64 \
            -DDIN_BUILD_TRT_RTX_EP=ON

      - name: Build
        env:
          BUILD_TARGETS: ${{ needs.plan.outputs.targets }}
        run: python3 .github/scripts/model_ci.py build --preset linux-x64-release

      - name: List registered CTest tests
        run: ctest --test-dir out/build/linux-x64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-release
          if-no-files-found: error
          path: out/build/linux-x64/bin/Release/

  linux-arm64:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Ubuntu 24.04 / Clang / ARM64
    runs-on: ubuntu-24.04-arm
    container: nvidia/cuda:13.2.1-devel-ubuntu24.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build tools
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates clang cmake git ninja-build python3 python3-dev

      - name: Check out source
        uses: actions/checkout@v7

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/linux-arm64/_deps
          key: linux-arm64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: bash
        run: cmake --preset linux-arm64 -DDIN_BUILD_TRT_RTX_EP=ON

      - name: Build
        env:
          BUILD_TARGETS: ${{ needs.plan.outputs.targets }}
        run: python3 .github/scripts/model_ci.py build --preset linux-arm64-release

      - name: List registered CTest tests
        run: ctest --test-dir out/build/linux-arm64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-release
          if-no-files-found: error
          path: out/build/linux-arm64/bin/Release/

  windows-x64:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Windows Server 2025 / MSVC / x64
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.1'

      - name: Restore CMake dependencies
        uses: actions/cache@v6
        with:
          path: out/build/windows-x64/_deps
          key: windows-x64-deps-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 `
            -DDIN_BUILD_TRT_RTX_EP=ON

      - name: Build
        env:
          BUILD_TARGETS: ${{ needs.plan.outputs.targets }}
        run: python .github/scripts/model_ci.py build --preset windows-x64-release

      - name: List registered CTest tests
        run: ctest --test-dir out/build/windows-x64 --build-config Release --show-only=human

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: out/build/windows-x64/bin/Release/

  model-tests:
    needs: [plan, linux-x64, windows-x64]
    if: >-
      !cancelled() && needs.plan.outputs.models == 'true' &&
      needs.linux-x64.result == 'success' && needs.windows-x64.result == 'success'
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/model-test.yml
    with:
      model: ${{ matrix.model }}
      variant: ${{ matrix.variant }}
      force_export: ${{ matrix.force_export }}
