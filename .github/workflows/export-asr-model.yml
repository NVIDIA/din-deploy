name: Export ASR model

on:
  workflow_call:
    inputs:
      model_slug:
        required: true
        type: string
      model_label:
        required: true
        type: string
      model_id:
        required: true
        type: string
      exporter:
        required: true
        type: string
      precision:
        required: true
        type: string
      fallback_precision:
        required: false
        default: ''
        type: string
      attention:
        required: false
        default: sdpa
        type: string
      python_changed:
        required: true
        type: string
      source_ref:
        required: true
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.export.outputs.artifact_name }}
      artifact_run_id:
        value: ${{ jobs.export.outputs.artifact_run_id }}

permissions:
  actions: read
  contents: read

jobs:
  export:
    name: Export ${{ inputs.model_label }} ONNX
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_name: ${{ steps.model-key.outputs.artifact_name }}
      artifact_run_id: ${{ steps.final-artifact.outputs.run_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Compute model artifact key
        id: model-key
        shell: bash
        env:
          EXPORTER: ${{ inputs.exporter }}
          MODEL_SLUG: ${{ inputs.model_slug }}
        run: |
          set -euo pipefail
          case "$EXPORTER" in
            whisper)
              source_globs=('asr/whisper/*.py' 'asr/whisper/**/*.py')
              ;;
            parakeet|nemotron)
              source_globs=('asr/rnnt/python/*.py' 'asr/rnnt/python/**/*.py')
              ;;
            *)
              echo "Unsupported exporter: $EXPORTER" >&2
              exit 2
              ;;
          esac
          source_hash="$(
            git ls-files -z -- "${source_globs[@]}" \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -d' ' -f1
          )"
          echo "source_hash=$source_hash" >> "$GITHUB_OUTPUT"
          echo "artifact_name=asr-${MODEL_SLUG}-onnx-v1-${source_hash:0:16}" >> "$GITHUB_OUTPUT"

      - name: Resolve reusable model artifact
        id: existing-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ARTIFACT: ${{ steps.model-key.outputs.artifact_name }}
          PYTHON_CHANGED: ${{ inputs.python_changed }}
        run: |
          set -euo pipefail
          artifact_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${MODEL_ARTIFACT}&per_page=100" \
              --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | last | .workflow_run.id // empty'
          )"
          if [[ "$PYTHON_CHANGED" == "true" || -z "$artifact_run_id" ]]; then
            echo "export=true" >> "$GITHUB_OUTPUT"
          else
            echo "export=false" >> "$GITHUB_OUTPUT"
          fi
          echo "run_id=$artifact_run_id" >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk space
        if: steps.existing-artifact.outputs.export == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /

      - name: Set up Python
        if: steps.existing-artifact.outputs.export == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Whisper export dependencies
        if: steps.existing-artifact.outputs.export == 'true' && inputs.exporter == 'whisper'
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install onnx onnxscript safetensors transformers

      - name: Install NeMo export dependencies
        if: steps.existing-artifact.outputs.export == 'true' && inputs.exporter != 'whisper'
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            onnx \
            onnxscript \
            soundfile \
            "nemo_toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@main"

      - name: Export ONNX model
        if: steps.existing-artifact.outputs.export == 'true'
        shell: bash
        env:
          ATTENTION: ${{ inputs.attention }}
          EXPORTER: ${{ inputs.exporter }}
          FALLBACK_PRECISION: ${{ inputs.fallback_precision }}
          MODEL_ID: ${{ inputs.model_id }}
          MODEL_OUTPUT: artifacts/ci/${{ inputs.model_slug }}
          PRECISION: ${{ inputs.precision }}
          PYTHONPATH: asr/rnnt/python
          SOURCE_HASH: ${{ steps.model-key.outputs.source_hash }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -uo pipefail
          run_export() {
            local precision="$1"
            case "$EXPORTER" in
              whisper)
                python asr/whisper/model_export/export_whisper.py \
                  --model "$MODEL_ID" \
                  --output "$MODEL_OUTPUT" \
                  --device cpu \
                  --dtype "$precision" \
                  --attention "$ATTENTION"
                ;;
              parakeet)
                python asr/rnnt/python/tools/export_parakeet_tdt_onnx.py \
                  --model "$MODEL_ID" \
                  --output "$MODEL_OUTPUT" \
                  --device cpu \
                  --dtype "$precision" \
                  --external-data
                ;;
              nemotron)
                python asr/rnnt/python/tools/export_nemotron_onnx.py \
                  --model "$MODEL_ID" \
                  --output "$MODEL_OUTPUT" \
                  --device cpu \
                  --dtype "$precision" \
                  --external-data
                ;;
            esac
          }

          selected_precision="$PRECISION"
          set +e
          run_export "$selected_precision"
          export_status=$?
          set -e
          if [[ $export_status -ne 0 ]]; then
            if [[ -z "$FALLBACK_PRECISION" ]]; then
              exit "$export_status"
            fi
            echo "::warning::$PRECISION export failed; retrying once with $FALLBACK_PRECISION."
            rm -rf "$MODEL_OUTPUT"
            selected_precision="$FALLBACK_PRECISION"
            run_export "$selected_precision"
          fi

          case "$EXPORTER" in
            whisper)
              required_files=(encoder.onnx decoder.onnx mel.onnx vocab.json)
              ;;
            parakeet)
              required_files=(preprocessor.onnx encoder.onnx predict_step.onnx metadata.json tokenizer.json)
              ;;
            nemotron)
              required_files=(preprocessor.onnx encoder_step.onnx predict_step.onnx metadata.json vocab.txt decoder_init_hidden.f32 decoder_init_cell.f32)
              ;;
          esac
          for required_file in "${required_files[@]}"; do
            test -f "$MODEL_OUTPUT/$required_file"
          done

          export MODEL_ID MODEL_OUTPUT SELECTED_PRECISION="$selected_precision" SOURCE_HASH
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["MODEL_OUTPUT"])
          manifest = {
              "model_id": os.environ["MODEL_ID"],
              "precision": os.environ["SELECTED_PRECISION"],
              "source_hash": os.environ["SOURCE_HASH"],
              "commit": os.environ["SOURCE_REF"],
          }
          (output / "ci-export-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload ONNX model
        if: steps.existing-artifact.outputs.export == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.model-key.outputs.artifact_name }}
          path: artifacts/ci/${{ inputs.model_slug }}/
          if-no-files-found: error
          compression-level: 0

      - name: Select model artifact run
        id: final-artifact
        shell: bash
        env:
          EXPORTED: ${{ steps.existing-artifact.outputs.export }}
          EXISTING_RUN_ID: ${{ steps.existing-artifact.outputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EXPORTED" == "true" ]]; then
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$EXISTING_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
